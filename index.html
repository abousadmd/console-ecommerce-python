<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA CRÉATIVITÉ</title>

    <!-- Google Fonts: Syne, Inter, Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300..700&family=Syne:wght@400..800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="presentation-wrapper">
        <div class="aspect-ratio-container">

            <!-- Top Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Lateral Navigation -->
            <nav class="side-nav">
                <ul id="side-nav-list">
                    <!-- Nav items will be generated by JS -->
                </ul>
            </nav>

            <!-- Slides Container -->
            <main class="slides-wrapper" id="slides-wrapper">
                <!-- Slides will be injected here -->
            </main>

            <!-- Bottom Navigation -->
            <nav class="bottom-nav">
                <button class="nav-btn prev-btn" id="btn-prev">
                    <span class="arrow">←</span> PRÉCÉDENT
                </button>
                <div class="slide-counter">
                    <span id="current-slide">01</span> / <span id="total-slides">14</span>
                </div>
                <button class="nav-btn next-btn" id="btn-next">
                    SUIVANT <span class="arrow">→</span>
                </button>
            </nav>

        </div>
    </div>

    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="slide1_5_data.js"></script>
    <script src="slide6_10_data.js"></script>
    <script src="slide11_14_data.js"></script>
    <!-- Main JS -->
    <script src="script.js"></script>
</body>
</html>
